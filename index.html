<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسة بدر الدين الغزال</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            text-align: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding-bottom: 100px;
        }

        .header {
            margin-bottom: 30px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px auto;
            flex-wrap: wrap;
        }

        .logo {
            width: 150px;
            height: 150px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
        }

        h1 {
            color: #ff9800;
            margin: 20px 0;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin: 30px 0;
        }

        .btn {
            padding: 15px 25px;
            background: linear-gradient(45deg, #ff9800, #f57c00);
            color: #212121;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 90%;
            max-width: 300px;
            transition: transform 0.3s;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .section {
            display: none;
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #444;
        }

        input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #333;
            color: white;
            width: 90%;
            max-width: 250px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            background: #222;
        }

        th, td {
            border: 1px solid #444;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #333;
            color: #ff9800;
        }

        .developer-info {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(45deg, #0a3d0a, #1a5c1a);
            color: #FFD700;
            padding: 12px;
            text-align: center;
            font-weight: bold;
        }

        .error-message {
            color: #ff6b6b;
            padding: 10px;
            margin: 10px 0;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 5px;
        }

        .success-message {
            color: #51cf66;
            padding: 10px;
            margin: 10px 0;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            .logo {
                width: 120px;
                height: 120px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="https://i.ibb.co/KpdJjYwq/logo.jpg" alt="شعار المدرسة" class="logo">
                <img src="https://i.ibb.co/r21PcRk9/logo2.jpg" alt="شعار المدرسة" class="logo">
            </div>
            
            <h1>مدرسة بدر الدين الغزال</h1>
            <p class="subtitle">نظام المعلومات وإدارة المدرسة</p>
        </div>

        <div class="buttons-container">
            <button class="btn" onclick="showSection('parent')">👨‍👩‍👧‍👦 دخول ولي الأمر</button>
            <button class="btn" onclick="askPassword('teacher')">👨‍🏫 دخول معلم</button>
            <button class="btn" onclick="askPassword('admin')">🧑‍💼 دخول مدير</button>
        </div>

        <div id="parent" class="section">
            <h2>استعلام ولي الأمر</h2>
            <input id="searchName" placeholder="اسم الطالب (مطلوب)">
            <input id="searchClass" placeholder="الصف (اختياري)">
            <button class="btn" onclick="searchStudent()">🔍 بحث</button>
            <div id="result"></div>
        </div>

        <div id="teacher" class="section">
            <h2>إدخال بيانات الطالب</h2>
            <input id="name" placeholder="اسم الطالب *">
            <input id="class" placeholder="الصف *">
            <input id="group" placeholder="الشعبة">
            <input id="subject" placeholder="المادة *">
            <input id="absence" placeholder="غياب">
            <input id="delay" placeholder="تأخر">
            <input id="homework" placeholder="وظائف">
            <input id="quiz" placeholder="مذاكرة">
            <input id="exam" placeholder="امتحان">
            <input id="date" placeholder="تاريخ">
            <button class="btn" onclick="saveData()">💾 حفظ البيانات</button>
        </div>

        <div id="admin" class="section">
            <h2>لوحة المدير</h2>
            <button class="btn" onclick="loadData()">🔄 تحديث البيانات</button>
            <div id="adminData"></div>
        </div>
    </div>

    <div class="developer-info">
        تم التصميم والبرمجة بواسطة <span style="color: #FFD700">محد الحسين</span> - 0952725590
    </div>

    <script>
        const apiURL = "https://sheetdb.io/api/v1/6534bwnl5o7sl";
        const passwords = { teacher: "1990", admin: "1992" };

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.style.display = 'none';
            });
            document.getElementById(sectionId).style.display = 'block';
        }

        function askPassword(role) {
            const password = prompt('أدخل كلمة المرور:');
            if (password === passwords[role]) {
                showSection(role);
                if (role === 'admin') loadData();
            } else {
                alert('كلمة المرور غير صحيحة');
            }
        }

        function saveData() {
            const data = {
                name: document.getElementById('name').value.trim(),
                class: document.getElementById('class').value.trim(),
                group: document.getElementById('group').value.trim(),
                subject: document.getElementById('subject').value.trim(),
                absence: document.getElementById('absence').value.trim(),
                delay: document.getElementById('delay').value.trim(),
                homework: document.getElementById('homework').value.trim(),
                quiz: document.getElementById('quiz').value.trim(),
                exam: document.getElementById('exam').value.trim(),
                date: document.getElementById('date').value.trim() || new Date().toLocaleDateString('ar-EG')
            };

            // التحقق من الحقول المطلوبة
            if (!data.name || !data.class || !data.subject) {
                alert('⚠️ يرجى ملء الحقول المطلوبة (الاسم، الصف، المادة)');
                return;
            }

            fetch(apiURL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ data: data })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                alert('✅ تم حفظ البيانات بنجاح');
                // مسح الحقول بعد الحفظ
                document.querySelectorAll('#teacher input').forEach(input => input.value = '');
            })
            .catch(error => {
                console.error('Error:', error);
                alert('❌ حدث خطأ في حفظ البيانات');
            });
        }

        function searchStudent() {
            const name = document.getElementById('searchName').value.trim();
            const className = document.getElementById('searchClass').value.trim();

            // التحقق من إدخال اسم الطالب
            if (!name) {
                document.getElementById('result').innerHTML = 
                    '<div class="error-message">⚠️ يرجى إدخال اسم الطالب للبحث</div>';
                return;
            }

            document.getElementById('result').innerHTML = '<p>جاري البحث...</p>';

            fetch(apiURL)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Data received:', data); // للتصحيح
                    
                    // البحث في البيانات
                    const results = data.filter(student => {
                        const nameMatch = student.name && student.name.includes(name);
                        const classMatch = !className || (student.class && student.class.includes(className));
                        return nameMatch && classMatch;
                    });
                    
                    console.log('Search results:', results); // للتصحيح
                    
                    if (results.length === 0) {
                        document.getElementById('result').innerHTML = 
                            '<div class="error-message">❌ لا توجد نتائج تطابق معايير البحث</div>';
                        return;
                    }
                    
                    // عرض النتائج في جدول
                    let html = `
                        <div class="success-message">
                            ✅ تم العثور على ${results.length} نتيجة
                        </div>
                        <table>
                            <tr>
                                <th>الاسم</th>
                                <th>الصف</th>
                                <th>الشعبة</th>
                                <th>المادة</th>
                                <th>الغياب</th>
                                <th>التأخر</th>
                                <th>الوظائف</th>
                                <th>المذاكرة</th>
                                <th>الامتحان</th>
                                <th>التاريخ</th>
                            </tr>
                    `;
                    
                    results.forEach(student => {
                        html += `
                            <tr>
                                <td>${student.name || '-'}</td>
                                <td>${student.class || '-'}</td>
                                <td>${student.group || '-'}</td>
                                <td>${student.subject || '-'}</td>
                                <td>${student.absence || '-'}</td>
                                <td>${student.delay || '-'}</td>
                                <td>${student.homework || '-'}</td>
                                <td>${student.quiz || '-'}</td>
                                <td>${student.exam || '-'}</td>
                                <td>${student.date || '-'}</td>
                            </tr>
                        `;
                    });
                    
                    html += '</table>';
                    document.getElementById('result').innerHTML = html;
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('result').innerHTML = 
                        '<div class="error-message">❌ حدث خطأ في جلب البيانات. يرجى المحاولة مرة أخرى</div>';
                });
        }

        function loadData() {
            fetch(apiURL)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.length === 0) {
                        document.getElementById('adminData').innerHTML = 
                            '<div class="error-message">لا توجد بيانات في النظام</div>';
                        return;
                    }
                    
                    let html = `
                        <div class="success-message">
                            📊 إجمالي السجلات: ${data.length}
                        </div>
                        <table>
                            <tr>
                                <th>الاسم</th>
                                <th>الصف</th>
                                <th>الشعبة</th>
                                <th>المادة</th>
                                <th>الغياب</th>
                                <th>التأخر</th>
                                <th>الوظائف</th>
                                <th>المذاكرة</th>
                                <th>الامتحان</th>
                                <th>التاريخ</th>
                            </tr>
                    `;
                    
                    data.forEach(student => {
                        html += `
                            <tr>
                                <td>${student.name || '-'}</td>
                                <td>${student.class || '-'}</td>
                                <td>${student.group || '-'}</td>
                                <td>${student.subject || '-'}</td>
                                <td>${student.absence || '-'}</td>
                                <td>${student.delay || '-'}</td>
                                <td>${student.homework || '-'}</td>
                                <td>${student.quiz || '-'}</td>
                                <td>${student.exam || '-'}</td>
                                <td>${student.date || '-'}</td>
                            </tr>
                        `;
                    });
                    
                    html += '</table>';
                    document.getElementById('adminData').innerHTML = html;
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('adminData').innerHTML = 
                        '<div class="error-message">❌ حدث خطأ في تحميل البيانات</div>';
                });
        }

        // إضافة تاريخ تلقائي عند فتح صفحة المعلم
        document.getElementById('date').value = new Date().toLocaleDateString('ar-EG');
    </script>
</body>
</html>
