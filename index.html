<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسة بدر الدين الغزال</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            text-align: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding-bottom: 100px;
        }

        .header {
            margin-bottom: 30px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px auto;
            flex-wrap: wrap;
        }

        .logo {
            width: 150px;
            height: 150px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
        }

        h1 {
            color: #ff9800;
            margin: 20px 0;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin: 30px 0;
        }

        .btn {
            padding: 15px 25px;
            background: linear-gradient(45deg, #ff9800, #f57c00);
            color: #212121;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 90%;
            max-width: 300px;
            transition: transform 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .section {
            display: none;
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #444;
        }

        input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #333;
            color: white;
            width: 90%;
            max-width: 250px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            background: #222;
        }

        th, td {
            border: 1px solid #444;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #333;
            color: #ff9800;
        }

        .developer-info {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(45deg, #0a3d0a, #1a5c1a);
            color: #FFD700;
            padding: 12px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .logo {
                width: 120px;
                height: 120px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="https://i.ibb.co/KpdJjYwq/logo.jpg" alt="شعار المدرسة" class="logo">
                <img src="https://i.ibb.co/r21PcRk9/logo2.jpg" alt="شعار المدرسة" class="logo">
            </div>
            
            <h1>مدرسة بدر الدين الغزال</h1>
            <p class="subtitle">نظام المعلومات وإدارة المدرسة</p>
        </div>

        <div class="buttons-container">
            <button class="btn" onclick="showSection('parent')">👨‍👩‍👧‍👦 دخول ولي الأمر</button>
            <button class="btn" onclick="askPassword('teacher')">👨‍🏫 دخول معلم</button>
            <button class="btn" onclick="askPassword('admin')">🧑‍💼 دخول مدير</button>
        </div>

        <div id="parent" class="section">
            <h2>استعلام ولي الأمر</h2>
            <input id="searchName" placeholder="اسم الطالب">
            <input id="searchClass" placeholder="الصف">
            <button class="btn" onclick="searchStudent()">🔍 بحث</button>
            <div id="result"></div>
        </div>

        <div id="teacher" class="section">
            <h2>إدخال بيانات الطالب</h2>
            <input id="name" placeholder="اسم الطالب">
            <input id="class" placeholder="الصف">
            <input id="group" placeholder="الشعبة">
            <input id="subject" placeholder="المادة">
            <input id="absence" placeholder="غياب">
            <input id="delay" placeholder="تأخر">
            <input id="homework" placeholder="وظائف">
            <input id="quiz" placeholder="مذاكرة">
            <input id="exam" placeholder="امتحان">
            <input id="date" placeholder="تاريخ">
            <button class="btn" onclick="saveData()">💾 حفظ البيانات</button>
        </div>

        <div id="admin" class="section">
            <h2>لوحة المدير</h2>
            <button class="btn" onclick="loadData()">🔄 تحديث البيانات</button>
            <div id="adminData"></div>
        </div>
    </div>

    <div class="developer-info">
        تم التصميم والبرمجة بواسطة <span style="color: #FFD700">محد الحسين</span> - 0952725590
    </div>

    <script>
        const apiURL = "https://sheetdb.io/api/v1/6534bwnl5o7sl";
        const passwords = { teacher: "1990", admin: "1992" };

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.style.display = 'none';
            });
            document.getElementById(sectionId).style.display = 'block';
        }

        function askPassword(role) {
            const password = prompt('أدخل كلمة المرور:');
            if (password === passwords[role]) {
                showSection(role);
                if (role === 'admin') loadData();
            } else {
                alert('كلمة المرور غير صحيحة');
            }
        }

        function saveData() {
            const data = {
                name: document.getElementById('name').value,
                class: document.getElementById('class').value,
                group: document.getElementById('group').value,
                subject: document.getElementById('subject').value,
                absence: document.getElementById('absence').value,
                delay: document.getElementById('delay').value,
                homework: document.getElementById('homework').value,
                quiz: document.getElementById('quiz').value,
                exam: document.getElementById('exam').value,
                date: document.getElementById('date').value
            };

            fetch(apiURL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ data: data })
            })
            .then(response => response.json())
            .then(data => {
                alert('تم حفظ البيانات بنجاح');
                document.querySelectorAll('#teacher input').forEach(input => input.value = '');
            })
            .catch(error => {
                alert('حدث خطأ في الحفظ');
            });
        }

        function searchStudent() {
            const name = document.getElementById('searchName').value;
            const className = document.getElementById('searchClass').value;

            fetch(apiURL)
                .then(response => response.json())
                .then(data => {
                    const results = data.filter(student => 
                        student.name.includes(name) && student.class.includes(className)
                    );
                    
                    let html = '<table><tr><th>الاسم</th><th>الصف</th><th>المادة</th><th>الغياب</th><th>التأخر</th><th>الوظائف</th></tr>';
                    results.forEach(student => {
                        html += `<tr>
                            <td>${student.name}</td>
                            <td>${student.class}</td>
                            <td>${student.subject}</td>
                            <td>${student.absence}</td>
                            <td>${student.delay}</td>
                            <td>${student.homework}</td>
                        </tr>`;
                    });
                    html += '</table>';
                    
                    document.getElementById('result').innerHTML = html;
                })
                .catch(error => {
                    document.getElementById('result').innerHTML = '<p>حدث خطأ في البحث</p>';
                });
        }

        function loadData() {
            fetch(apiURL)
                .then(response => response.json())
                .then(data => {
                    let html = '<table><tr><th>الاسم</th><th>الصف</th><th>الشعبة</th><th>المادة</th><th>الغياب</th><th>التأخر</th></tr>';
                    data.forEach(student => {
                        html += `<tr>
                            <td>${student.name}</td>
                            <td>${student.class}</td>
                            <td>${student.group}</td>
                            <td>${student.subject}</td>
                            <td>${student.absence}</td>
                            <td>${student.delay}</td>
                        </tr>`;
                    });
                    html += '</table>';
                    
                    document.getElementById('adminData').innerHTML = html;
                })
                .catch(error => {
                    document.getElementById('adminData').innerHTML = '<p>حدث خطأ في تحميل البيانات</p>';
                });
        }
    </script>
</body>
</html>
