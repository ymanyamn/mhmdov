<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسة بدر الدين الغزال</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            text-align: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 100px;
        }

        .header {
            margin-bottom: 30px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px auto;
            flex-wrap: wrap;
        }

        .logo {
            width: 150px;
            height: 150px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
            object-fit: cover;
        }

        h1 {
            color: #ff9800;
            margin: 20px 0;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #ccc;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        /* تصميم سطح المكتب */
        .desktop-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }

        .main-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .quick-access {
            background: rgba(30, 30, 30, 0.8);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
        }

        .btn {
            padding: 15px 25px;
            background: linear-gradient(45deg, #ff9800, #f57c00);
            color: #212121;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin: 5px 0;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.3);
        }

        .btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .section {
            display: none;
            background: rgba(30, 30, 30, 0.9);
            padding: 25px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #444;
            min-height: 500px;
        }

        .active-section {
            display: block;
        }

        input {
            padding: 12px;
            margin: 8px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #333;
            color: white;
            width: calc(100% - 20px);
            max-width: 300px;
            font-size: 14px;
        }

        input:focus {
            outline: 2px solid #ff9800;
            border-color: #ff9800;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        th, td {
            border: 1px solid #444;
            padding: 12px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background: #333;
            color: #ff9800;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background: #2a2a2a;
        }

        tr:hover {
            background: #363636;
        }

        .developer-info {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(45deg, #0a3d0a, #1a5c1a);
            color: #FFD700;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            z-index: 1000;
        }

        .error-message {
            color: #ff6b6b;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 6px;
            border: 1px solid #ff6b6b;
        }

        .success-message {
            color: #51cf66;
            padding: 12px;
            margin: 10px 0;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 6px;
            border: 1px solid #51cf66;
        }

        .loading {
            color: #ff9800;
            padding: 12px;
            font-size: 16px;
        }

        .form-group {
            margin: 15px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .back-btn {
            background: linear-gradient(45deg, #666, #888);
            margin-bottom: 15px;
        }

        .back-btn:hover {
            background: linear-gradient(45deg, #777, #999);
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {
            background: rgba(255, 152, 0, 0.1);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ff9800;
        }

        @media (max-width: 768px) {
            .desktop-layout {
                grid-template-columns: 1fr;
            }
            
            .logo {
                width: 120px;
                height: 120px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="https://i.ibb.co/KpdJjYwq/logo.jpg" alt="شعار المدرسة" class="logo">
                <img src="https://i.ibb.co/r21PcRk9/logo2.jpg" alt="شعار المدرسة" class="logo">
            </div>
            
            <h1>مدرسة بدر الدين الغزال</h1>
            <p class="subtitle">نظام المعلومات وإدارة المدرسة</p>
        </div>

        <!-- واجهة سطح المكتب الرئيسية -->
        <div id="desktop" class="desktop-layout">
            <div class="main-buttons">
                <button class="btn" onclick="showSection('parent')">👨‍👩‍👧‍👦 دخول ولي الأمر</button>
                <button class="btn" onclick="askPassword('teacher')">👨‍🏫 دخول معلم</button>
                <button class="btn" onclick="askPassword('admin')">🧑‍💼 دخول مدير</button>
            </div>
            
            <div class="quick-access">
                <h3 style="color: #ff9800; margin-bottom: 15px;">⚡ وصول سريع</h3>
                <div class="stats-container">
                    <div class="stat-card">
                        <h4>إجمالي الطلاب</h4>
                        <p id="totalStudents">0</p>
                    </div>
                    <div class="stat-card">
                        <h4>آخر تحديث</h4>
                        <p id="lastUpdate">-</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- الأقسام -->
        <div id="parent" class="section">
            <button class="btn back-btn" onclick="showDesktop()">← العودة للشاشة الرئيسية</button>
            <h2>استعلام ولي الأمر</h2>
            <div class="form-group">
                <input id="searchName" placeholder="اسم الطالب (مطلوب)">
                <input id="searchClass" placeholder="الصف (اختياري)">
            </div>
            <button class="btn" onclick="searchStudent()" id="searchBtn">🔍 بحث</button>
            <div id="result"></div>
        </div>

        <div id="teacher" class="section">
            <button class="btn back-btn" onclick="showDesktop()">← العودة للشاشة الرئيسية</button>
            <h2>إدخال بيانات الطالب</h2>
            <div class="form-group">
                <input id="name" placeholder="اسم الطالب *">
                <input id="class" placeholder="الصف *">
                <input id="group" placeholder="الشعبة">
            </div>
            <div class="form-group">
                <input id="subject" placeholder="المادة *">
                <input id="absence" placeholder="غياب">
                <input id="delay" placeholder="تأخر">
            </div>
            <div class="form-group">
                <input id="homework" placeholder="وظائف">
                <input id="quiz" placeholder="مذاكرة">
                <input id="exam" placeholder="امتحان">
                <input id="date" placeholder="تاريخ">
            </div>
            <button class="btn" onclick="saveData()" id="saveBtn">💾 حفظ البيانات</button>
            <div id="saveResult"></div>
        </div>

        <div id="admin" class="section">
            <button class="btn back-btn" onclick="showDesktop()">← العودة للشاشة الرئيسية</button>
            <h2>لوحة المدير</h2>
            <div class="stats-container">
                <div class="stat-card">
                    <h4>إجمالي السجلات</h4>
                    <p id="adminTotal">0</p>
                </div>
                <div class="stat-card">
                    <h4>أحدث إضافة</h4>
                    <p id="latestRecord">-</p>
                </div>
            </div>
            <button class="btn" onclick="loadData()" id="loadBtn">🔄 تحديث البيانات</button>
            <button class="btn" onclick="exportData()" style="background: linear-gradient(45deg, #28a745, #20c997);">📤 تصدير البيانات</button>
            <button class="btn" onclick="clearAllData()" style="background: linear-gradient(45deg, #dc3545, #e83e8c);">🗑️ مسح الكل</button>
            <div id="adminData"></div>
        </div>
    </div>

    <div class="developer-info">
        تم التصميم والبرمجة بواسطة <span style="color: #FFD700">محد الحسين</span> - 0952725590
    </div>

    <script>
        // قاعدة بيانات محلية
        let localDatabase = JSON.parse(localStorage.getItem('schoolData')) || [];
        const passwords = { teacher: "1990", admin: "1992" };

        // تهيئة الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            updateStats();
            document.getElementById('date').value = new Date().toLocaleDateString('ar-EG');
        });

        function showDesktop() {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active-section');
            });
            document.getElementById('desktop').style.display = 'grid';
            updateStats();
        }

        function showSection(sectionId) {
            document.getElementById('desktop').style.display = 'none';
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active-section');
            });
            document.getElementById(sectionId).classList.add('active-section');
        }

        function askPassword(role) {
            const password = prompt('أدخل كلمة المرور:');
            if (password === passwords[role]) {
                showSection(role);
                if (role === 'admin') loadData();
            } else {
                alert('كلمة المرور غير صحيحة');
            }
        }

        function updateStats() {
            localDatabase = JSON.parse(localStorage.getItem('schoolData')) || [];
            document.getElementById('totalStudents').textContent = localDatabase.length;
            
            if (localDatabase.length > 0) {
                const lastRecord = localDatabase[localDatabase.length - 1];
                document.getElementById('lastUpdate').textContent = lastRecord.date || '-';
            } else {
                document.getElementById('lastUpdate').textContent = '-';
            }
        }

        function saveData() {
            const saveBtn = document.getElementById('saveBtn');
            const saveResult = document.getElementById('saveResult');
            
            const data = {
                id: Date.now().toString(),
                name: document.getElementById('name').value.trim(),
                class: document.getElementById('class').value.trim(),
                group: document.getElementById('group').value.trim(),
                subject: document.getElementById('subject').value.trim(),
                absence: document.getElementById('absence').value.trim(),
                delay: document.getElementById('delay').value.trim(),
                homework: document.getElementById('homework').value.trim(),
                quiz: document.getElementById('quiz').value.trim(),
                exam: document.getElementById('exam').value.trim(),
                date: document.getElementById('date').value.trim() || new Date().toLocaleDateString('ar-EG')
            };

            if (!data.name || !data.class || !data.subject) {
                saveResult.innerHTML = '<div class="error-message">⚠️ يرجى ملء الحقول المطلوبة (الاسم، الصف، المادة)</div>';
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerHTML = '⏳ جاري الحفظ...';
            saveResult.innerHTML = '<div class="loading">جاري حفظ البيانات...</div>';

            setTimeout(() => {
                try {
                    localDatabase.push(data);
                    localStorage.setItem('schoolData', JSON.stringify(localDatabase));
                    
                    saveResult.innerHTML = '<div class="success-message">✅ تم حفظ البيانات بنجاح</div>';
                    
                    document.querySelectorAll('#teacher input').forEach(input => {
                        if (input.id !== 'date') input.value = '';
                    });
                    
                    updateStats();
                    
                } catch (error) {
                    saveResult.innerHTML = '<div class="error-message">❌ حدث خطأ في حفظ البيانات</div>';
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = '💾 حفظ البيانات';
                    
                    setTimeout(() => {
                        saveResult.innerHTML = '';
                    }, 5000);
                }
            }, 1000);
        }

        function searchStudent() {
            const searchBtn = document.getElementById('searchBtn');
            const resultDiv = document.getElementById('result');
            const name = document.getElementById('searchName').value.trim();
            const className = document.getElementById('searchClass').value.trim();

            if (!name) {
                resultDiv.innerHTML = '<div class="error-message">⚠️ يرجى إدخال اسم الطالب للبحث</div>';
                return;
            }

            searchBtn.disabled = true;
            searchBtn.innerHTML = '⏳ جاري البحث...';
            resultDiv.innerHTML = '<div class="loading">جاري البحث في البيانات...</div>';

            setTimeout(() => {
                try {
                    localDatabase = JSON.parse(localStorage.getItem('schoolData')) || [];
                    
                    const results = localDatabase.filter(student => {
                        const nameMatch = student.name && student.name.toLowerCase().includes(name.toLowerCase());
                        const classMatch = !className || (student.class && student.class.includes(className));
                        return nameMatch && classMatch;
                    });
                    
                    if (results.length === 0) {
                        resultDiv.innerHTML = '<div class="error-message">❌ لا توجد نتائج تطابق معايير البحث</div>';
                        return;
                    }
                    
                    let html = `
                        <div class="success-message">
                            ✅ تم العثور على ${results.length} نتيجة
                        </div>
                        <table>
                            <tr>
                                <th>الاسم</th>
                                <th>الصف</th>
                                <th>الشعبة</th>
                                <th>المادة</th>
                                <th>الغياب</th>
                                <th>التأخر</th>
                                <th>الوظائف</th>
                                <th>المذاكرة</th>
                                <th>الامتحان</th>
                                <th>التاريخ</th>
                            </tr>
                    `;
                    
                    results.forEach(student => {
                        html += `
                            <tr>
                                <td>${student.name || '-'}</td>
                                <td>${student.class || '-'}</td>
                                <td>${student.group || '-'}</td>
                                <td>${student.subject || '-'}</td>
                                <td>${student.absence || '-'}</td>
                                <td>${student.delay || '-'}</td>
                                <td>${student.homework || '-'}</td>
                                <td>${student.quiz || '-'}</td>
                                <td>${student.exam || '-'}</td>
                                <td>${student.date || '-'}</td>
                            </tr>
                        `;
                    });
                    
                    html += '</table>';
                    resultDiv.innerHTML = html;
                    
                } catch (error) {
                    resultDiv.innerHTML = '<div class="error-message">❌ حدث خطأ في البحث</div>';
                } finally {
                    searchBtn.disabled = false;
                    searchBtn.innerHTML = '🔍 بحث';
                }
            }, 1000);
        }

        function loadData() {
            const loadBtn = document.getElementById('loadBtn');
            const adminData = document.getElementById('adminData');

            loadBtn.disabled = true;
            loadBtn.innerHTML = '⏳ جاري التحميل...';
            adminData.innerHTML = '<div class="loading">جاري تحميل البيانات...</div>';

            setTimeout(() => {
                try {
                    localDatabase = JSON.parse(localStorage.getItem('schoolData')) || [];
                    
                    document.getElementById('adminTotal').textContent = localDatabase.length;
                    
                    if (localDatabase.length > 0) {
                        const latest = localDatabase[localDatabase.length - 1];
                        document.getElementById('latestRecord').textContent = latest.name || '-';
                    }
                    
                    if (localDatabase.length === 0) {
                        adminData.innerHTML = '<div class="error-message">لا توجد بيانات في النظام</div>';
                        return;
                    }
                    
                    let html = `
                        <div class="success-message">
                            📊 إجمالي السجلات: ${localDatabase.length}
                        </div>
                        <table>
                            <tr>
                                <th>الاسم</th>
                                <th>الصف</th>
                                <th>الشعبة</th>
                                <th>المادة</th>
                                <th>الغياب</th>
                                <th>التأخر</th>
                                <th>الوظائف</th>
                                <th>المذاكرة</th>
                                <th>الامتحان</th>
                                <th>التاريخ</th>
                                <th>حذف</th>
                            </tr>
                    `;
                    
                    localDatabase.forEach((student, index) => {
                        html += `
                            <tr>
                                <td>${student.name || '-'}</td>
                                <td>${student.class || '-'}</td>
                                <td>${student.group || '-'}</td>
                                <td>${student.subject || '-'}</td>
                                <td>${student.absence || '-'}</td>
                                <td>${student.delay || '-'}</td>
                                <td>${student.homework || '-'}</td>
                                <td>${student.quiz || '-'}</td>
                                <td>${student.exam || '-'}</td>
                                <td>${student.date || '-'}</td>
                                <td><button onclick="deleteRecord(${index})" class="btn" style="padding: 5px 10px; font-size: 12px; background: #dc3545;">🗑️</button></td>
                            </tr>
                        `;
                    });
                    
                    html += '</table>';
                    adminData.innerHTML = html;
                    
                } catch (error) {
                    adminData.innerHTML = '<div class="error-message">❌ حدث خطأ في تحميل البيانات</div>';
                } finally {
                    loadBtn.disabled = false;
                    loadBtn.innerHTML = '🔄 تحديث البيانات';
                }
            }, 1000);
        }

        function deleteRecord(index) {
            if (confirm('هل أنت متأكد من حذف هذا السجل؟')) {
                localDatabase.splice(index, 1);
                localStorage.setItem('schoolData', JSON.stringify(localDatabase));
                loadData();
                updateStats();
            }
        }

        function exportData() {
            const dataStr = JSON.stringify(localDatabase, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'school_data.json';
            link.click();
            URL.revokeObjectURL(url);
        }

        function clearAllData() {
            if (confirm('⚠️ هل أنت متأكد من مسح جميع البيانات؟ لا يمكن التراجع عن هذا الإجراء!')) {
                localDatabase = [];
                localStorage.setItem('schoolData', JSON.stringify(localDatabase));
                loadData();
                updateStats();
                alert('✅ تم مسح جميع البيانات');
            }
        }

        // تهيئة التخزين المحلي
        if (!localStorage.getItem('schoolData')) {
            localStorage.setItem('schoolData', JSON.stringify([]));
        }
    </script>
</body>
</html>
